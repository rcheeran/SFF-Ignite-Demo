apiVersion: v1
kind: Namespace
metadata:
  name: productdaydemo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-detection
  namespace: productdaydemo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vision-detection
  template:
    metadata:
      labels:
        app: vision-detection
    spec:
      # Resolve multi-dot names (the Foundry service FQDN) as absolute first, so
      # each request does not first try search suffixes such as the host's
      # "localdomain", which CoreDNS forwards to the venue network's DNS.
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      containers:
        - name: detection
          image: productdaydemo/vision-detection:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "8096"
            - name: DETECTION_MODEL
              value: candy-yolo11s
            - name: FOUNDRY_URL
              value: https://candy-yolo11s.foundry-local-operator.svc.cluster.local:5000
            - name: FOUNDRY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: candy-yolo11s-client
                  key: api-key
            - name: FOUNDRY_CA_CERT
              value: /foundry-ca/ca.crt
            - name: FOUNDRY_TIMEOUT_SECONDS
              value: "30"
            - name: NMS_IOU_THRESHOLD
              value: "0.45"
          ports:
            - name: http
              containerPort: 8096
              hostPort: 8096
              hostIP: 127.0.0.1
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: foundry-ca
              mountPath: /foundry-ca
              readOnly: true
      volumes:
        - name: foundry-ca
          configMap:
            name: foundry-local-ca
---
apiVersion: v1
kind: Service
metadata:
  name: vision-detection
  namespace: productdaydemo
spec:
  selector:
    app: vision-detection
  ports:
    - name: http
      port: 8096
      targetPort: http
