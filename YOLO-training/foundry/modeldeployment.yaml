apiVersion: foundrylocal.azure.com/v1
kind: ModelDeployment
metadata:
  name: candy-yolo11s
  namespace: foundry-local-operator
spec:
  displayName: Candy YOLO11s
  workloadType: predictive
  runtime: onnx-genai
  compute: gpu
  runtimeClassName: nvidia
  model:
    custom:
      registry: ignitedemoregistry.azurecr.io
      repository: models/candy-yolo11s
      tag: v1
      task: object-detection
      credentials:
        secretRef:
          name: candy-yolo11s-acr
          usernameKey: username
          passwordKey: password
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
      gpu: 1
  env:
    - name: BATCH_SIZE
      value: "1"
    # Load the copy the model-store-pull init container places in the pod from the
    # on-device Foundry model store, instead of re-downloading from the registry at
    # every pod start (a registry TLS failure after a reboot left the model unloaded).
    # These entries follow the operator's own USE_ORAS, so they take precedence.
    - name: USE_ORAS
      value: "false"
    - name: MODEL_PATH
      value: /home/foundry/.foundry/cache
  replicas: 1
  endpoint:
    enabled: true
    exposure: internal
    host: candy-yolo11s.local
